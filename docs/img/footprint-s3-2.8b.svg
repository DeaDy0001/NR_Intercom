Arial, sans-serif">• Maße aus der Waveshare-Maßzeichnung (ESP32-S3-Touch-LCD-2.8B-20241031), Rückseite gespiegelt. Ersetzt die alte Skizze.</text><text x="20.0" y="1075.4" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial, sans-serif">• Mitte der Leiste 6,30 mm vom Rand (= 2,80 mm neben der Lochmitte), Raster 2,54 mm.</text><text x="20.0" y="1095.4" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial, sans-serif">• Pin-Nummern wie in deinem EasyEDA-Symbol: 1–12 außen (TXD-Seite), 13–24 innen (SDA-Seite).</text><text x="20.0" y="1115.4" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial, sans-serif">• Board-Dicke gesamt 11,1 mm, Leiste ca. 6 mm unter dem Board. Belegt: 1/10/15/24 GND, 3/4 UART, 14 VCC ← VSYS, 16/17 USB, 19 GP4, 21/22 I2C.</text></svg>