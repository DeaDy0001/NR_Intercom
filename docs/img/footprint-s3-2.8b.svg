" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial, sans-serif">• Stiftleiste 2 × 12, Raster 2,54 mm (am 2.8B Buchse → auf der Trägerplatine Stiftleiste, THT).</text><text x="20.0" y="1075.4" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial, sans-serif">• Werte aus dem Produktfoto ausgemessen, Genauigkeit ca. ±0,3–0,5 mm → vor der Bestellung am echten Board nachmessen!</text><text x="20.0" y="1095.4" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial, sans-serif">• Abstand Display-Board ↔ Trägerplatine ca. 11 mm (Buchse + Stiftleiste); auf der 2.8B-Rückseite sitzen USB-C, Stecker, Schalter.</text></svg>